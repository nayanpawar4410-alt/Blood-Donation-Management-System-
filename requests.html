<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blood Requests</title><link rel="stylesheet" href="css/style.css"></head>
<body><nav><a href="dashboard.html">Dashboard</a><button onclick="logout()">Logout</button></nav><main class="container"><h2>Blood Request Management</h2><form id="requestForm" class="card"><input id="requester_name" placeholder="Requester name" required><input id="contact_phone" placeholder="Contact phone" required><select id="blood_group" required><option value="">Blood group</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option><option>O+</option><option>O-</option></select><input id="units_requested" type="number" min="1" placeholder="Units requested" required><input id="facility_name" placeholder="Hospital / Facility" required><input id="area" placeholder="Area" required><select id="urgency"><option>Normal</option><option>Urgent</option><option>Emergency</option></select><button>Create Request</button></form><div id="requestList"></div></main><script src="js/requests.js"></script></body></html>
