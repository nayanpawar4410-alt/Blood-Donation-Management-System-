<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Donors</title><link rel="stylesheet" href="css/style.css"></head>
<body><nav><a href="dashboard.html">Dashboard</a><button onclick="logout()">Logout</button></nav><main class="container"><h2>Donor Management</h2><form id="donorForm" class="card"><input id="full_name" placeholder="Full name" required><input id="phone" placeholder="Phone" required><input id="email" placeholder="Email"><select id="blood_group" required><option value="">Blood group</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option><option>O+</option><option>O-</option></select><input id="city_area" placeholder="City / Area" required><input id="last_donation_date" type="date"><label><input id="consent" type="checkbox" checked> Consent to contact</label><button>Add Donor</button></form><div class="card"><input id="search" placeholder="Search name, phone or email"><select id="filterGroup"><option value="">All blood groups</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option><option>O+</option><option>O-</option></select><input id="filterArea" placeholder="Area"><button onclick="loadDonors()">Search</button></div><div id="donorList"></div></main><script src="js/donors.js"></script></body></html>
